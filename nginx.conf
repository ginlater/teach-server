# teach.aibeautyfulwomen.com — HTTP 跳转 HTTPS + ACME
server {
    listen 80;
    server_name teach.aibeautyfulwomen.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# teach.aibeautyfulwomen.com — HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name teach.aibeautyfulwomen.com;

    ssl_certificate /etc/nginx/ssl/teach.aibeautyfulwomen.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/teach.aibeautyfulwomen.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/teach_access.log;
    error_log  /var/log/nginx/teach_error.log;
    client_max_body_size 10M;

    # 全部代理到 teach 独立服务（FastAPI 自挂静态文件 + API）
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
}
